name: Theme QA

# Runs before a merge (pull requests) and on every push to main and to feature branches.
# Only official GitHub actions are used; everything else is plain shell, so each step can be reproduced
# locally with the same command (see docs/TESTING.md).
#
# A release artifact (theme zip, plugin zip, version manifest, QA report) is produced only when every
# required job succeeded. Nothing here tags, publishes a GitHub release, pushes a branch or contacts the
# production site, so it can never trigger a deployment.

on:
  pull_request:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  WP_CLI_PHAR_URL: https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar

jobs:
  static:
    name: Static checks, build and packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Show tool versions
        run: |
          php -v
          composer --version
          node --version

      - name: Install PHP tooling
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Coding standards (WordPress, PHPCompatibilityWP for PHP 7.4 and later)
        run: vendor/bin/phpcs

      - name: Install Node tooling
        run: npm ci

      - name: Built assets are up to date and well formed
        run: npm run build:check

      - name: Download WP-CLI
        run: curl -fsSL -o "$RUNNER_TEMP/wp-cli.phar" "$WP_CLI_PHAR_URL"

      - name: Theme translation template is up to date
        run: bash tools/check-pot.sh "php $RUNNER_TEMP/wp-cli.phar --allow-root" . nguyen-ha-editorial languages/nguyen-ha-editorial.pot --skip-theme-json

      - name: Plugin translation template is up to date
        run: bash tools/check-pot.sh "php $RUNNER_TEMP/wp-cli.phar --allow-root" plugins/nguyen-ha-seo-companion nguyen-ha-seo-companion plugins/nguyen-ha-seo-companion/languages/nguyen-ha-seo-companion.pot

      - name: Build the installable zips and the version manifest
        run: bash tools/package.sh

      - name: Verify the zips (contents, development files, syntax, versions)
        run: bash tools/verify-package.sh dist

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

  php-syntax:
    name: PHP syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Lint every PHP file with the official PHP ${{ matrix.php }} image
        run: |
          docker run --rm -v "$PWD":/work -w /work php:${{ matrix.php }}-cli sh -c '
            status=0
            for file in $(find . -path ./.git -prune -o -path ./vendor -prune -o -path ./node_modules -prune -o -name "*.php" -print); do
              php -l "$file" > /dev/null || status=1
            done
            exit $status'

  phpunit:
    name: PHPUnit (WordPress ${{ matrix.wp }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The version the suites were developed and run against.
          - wp: '7.1.3'
            experimental: false
          # Forward-compatibility canary: whatever WordPress.org serves as the latest release. Its results are
          # reported but never block a release.
          - wp: 'latest'
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_phpunit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      WP_TESTS_DB_NAME: wp_phpunit
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_HOST: 127.0.0.1
      JUNIT_DIR: qa-junit${{ matrix.experimental && '/experimental' || '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install the PHP extensions the WordPress test suite needs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends php-mysql php-gd php-xml php-mbstring php-curl php-intl php-zip
          php -m | grep -E '^(mysqli|gd|dom|mbstring|libxml|curl|intl)$'

      - name: Install PHP tooling
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Download WordPress ${{ matrix.wp }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wp-cli.phar" "$WP_CLI_PHAR_URL"
          php "$RUNNER_TEMP/wp-cli.phar" --allow-root core download --path="$RUNNER_TEMP/wordpress" --version="${{ matrix.wp }}" --skip-content
          echo "WP_CORE_DIR=$RUNNER_TEMP/wordpress" >> "$GITHUB_ENV"
          mkdir -p "$JUNIT_DIR"

      - name: Theme suite (permalinks /%category%/%postname%/)
        run: vendor/bin/phpunit --testsuite theme --log-junit "$JUNIT_DIR/theme-wp${{ matrix.wp }}.xml"

      - name: Theme suite (permalinks of the live site, /%postname%/)
        if: ${{ !cancelled() }}
        env:
          NH_TEST_PERMALINKS: /%postname%/
        run: vendor/bin/phpunit --testsuite theme --log-junit "$JUNIT_DIR/theme-postname-wp${{ matrix.wp }}.xml"

      - name: Plugin suite
        if: ${{ !cancelled() }}
        run: vendor/bin/phpunit --testsuite plugin --log-junit "$JUNIT_DIR/plugin-wp${{ matrix.wp }}.xml"

      - name: Theme suite (multisite)
        if: ${{ !cancelled() && !matrix.experimental }}
        env:
          WP_MULTISITE: '1'
        run: vendor/bin/phpunit --testsuite theme --log-junit "$JUNIT_DIR/theme-multisite-wp${{ matrix.wp }}.xml"

      - name: Plugin suite (multisite)
        if: ${{ !cancelled() && !matrix.experimental }}
        env:
          WP_MULTISITE: '1'
        run: vendor/bin/phpunit --testsuite plugin --log-junit "$JUNIT_DIR/plugin-multisite-wp${{ matrix.wp }}.xml"

      - name: Upload the JUnit logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-phpunit-wp${{ matrix.wp }}
          path: qa-junit/
          if-no-files-found: ignore
          retention-days: 14

  min-wp:
    name: Site smoke test (WordPress ${{ matrix.wp }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 6.3 is the minimum the theme header declares ("Requires at least"); 6.5 is a mid-range release.
        wp: ['6.3.5', '6.5.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_site
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      SITE_URL: http://127.0.0.1:8080
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the PHP extensions WordPress needs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends php-mysql php-gd php-xml php-mbstring php-curl php-intl php-zip
          php -m | grep -E '^(mysqli|gd|dom|mbstring|libxml|curl|intl)$'

      - name: Download WP-CLI and WordPress ${{ matrix.wp }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wp-cli.phar" "$WP_CLI_PHAR_URL"
          php "$RUNNER_TEMP/wp-cli.phar" --allow-root core download --path="$RUNNER_TEMP/wp" --version="${{ matrix.wp }}"
          echo "WP_DIR=$RUNNER_TEMP/wp" >> "$GITHUB_ENV"

      - name: Provision the site (theme and companion plugin active, permalinks of the live site)
        env:
          WP_CLI: php ${{ runner.temp }}/wp-cli.phar
          DB_USER: root
          DB_PASS: root
          PERMALINKS: /%postname%/
        run: bash tests/bin/setup-site.sh "$WP_DIR" "$SITE_URL" wp_site

      - name: Seed the fixture content
        run: php "$RUNNER_TEMP/wp-cli.phar" --allow-root --path="$WP_DIR" eval-file tests/bin/seed-fixtures.php

      - name: Serve the site
        run: |
          nohup bash tests/bin/serve.sh "$WP_DIR" 8080 > "$RUNNER_TEMP/serve.log" 2>&1 &
          curl -fsS --retry 30 --retry-delay 1 --retry-connrefused -o /dev/null "$SITE_URL/"

      - name: Smoke test every page type
        run: python3 -I tests/bin/smoke.py "$SITE_URL" --log "$WP_DIR/wp-content/debug.log" --log "$WP_DIR/wp-content/php-error.log"

      - name: Show the PHP error log
        if: ${{ failure() }}
        run: cat "$WP_DIR/wp-content/debug.log" "$WP_DIR/wp-content/php-error.log" "$RUNNER_TEMP/serve.log" || true

  release:
    name: QA report and release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every job a release depends on. A job that failed, was cancelled or did not run blocks the artifact.
    needs: [static, php-syntax, phpunit, min-wp]
    if: ${{ always() }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the packages
        if: ${{ needs.static.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Download the JUnit logs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: junit-phpunit-*
          path: qa-junit
          merge-multiple: false

      - name: Build the QA report
        id: report
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > needs.json
          set +e
          python3 tools/qa-report.py --needs needs.json --required static,php-syntax,phpunit,min-wp \
            --junit-dir qa-junit --manifest dist/manifest.json --out qa
          status=$?
          set -e
          cat qa/qa-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "releasable=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Assemble the release artifact
        if: ${{ steps.report.outputs.releasable == 'true' }}
        run: |
          mkdir release
          cp dist/*.zip dist/manifest.json dist/SHA256SUMS qa/qa-report.md qa/qa-report.json release/

      - name: Upload the release artifact
        if: ${{ steps.report.outputs.releasable == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the QA report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop when the run is not releasable
        if: ${{ steps.report.outputs.releasable != 'true' }}
        run: |
          echo "At least one required gate failed or did not run: no release artifact was produced." >&2
          exit 1
